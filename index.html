<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Dieta</title>
  <meta name="description" content="Piano alimentare personale con i prodotti che compri tu." />
  <meta name="theme-color" content="#2f7d4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dieta" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // If something breaks, show it on screen instead of freezing silently (useful on iPhone, where there is no console).
    (function () {
      function show(msg) {
        var box = document.getElementById('crash');
        if (!box) {
          box = document.createElement('div');
          box.id = 'crash';
          box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;padding:12px;border-radius:12px;background:#ff3b30;color:#fff;font:13px -apple-system,sans-serif;white-space:pre-wrap;word-break:break-word';
          box.innerHTML = '<b>Errore</b> (mandami uno screenshot)<br><span></span><br><button onclick="location.reload()" style="margin-top:8px;padding:8px 14px;border:0;border-radius:8px;background:#fff;color:#ff3b30;font-weight:600">Ricarica</button> <button onclick="this.parentNode.remove()" style="margin-top:8px;padding:8px 14px;border:0;border-radius:8px;background:transparent;color:#fff;font-weight:600">Chiudi</button>';
          document.body.appendChild(box);
        }
        box.querySelector('span').textContent += msg + '\n';
      }
      // Only real errors of this app: not cancelled network requests (Firebase cancels them all the time
      // while it listens) and not the empty "Script error." that scripts from other sites produce.
      var ours = function (where) { return typeof where === 'string' && where.indexOf(location.origin) === 0; };
      addEventListener('error', function (e) {
        if (!e.filename || !ours(e.filename)) return;
        show((e.message || 'errore') + ' @ ' + e.filename.split('/').pop() + ':' + e.lineno);
      });
      addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        if (!r || r.name === 'AbortError' || r.code === 20 || !(r instanceof Error)) return;
        var at = (r.stack || '').match(/https?:\/\/[^\s)]+/);
        if (!at || !ours(at[0])) return;
        show(r.message);
      });
    })();
  </script>
  <script>
    // No zooming: Safari on iPhone ignores user-scalable=no, so pinch and double-tap are stopped here too,
    // and if the page ever ends up zoomed (e.g. when a field gets focus) it is snapped back to 100%.
    (function () {
      var stop = function (e) { e.preventDefault(); };
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, stop, { passive: false }); });
      document.addEventListener('touchstart', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
      var meta = document.querySelector('meta[name=viewport]');
      var base = meta.content;
      function unzoom() {
        if (!window.visualViewport || visualViewport.scale <= 1.01) return;
        meta.content = base + ', minimum-scale=1';
        setTimeout(function () { meta.content = base; }, 50);
      }
      document.addEventListener('focusin', function () { setTimeout(unzoom, 300); });
      document.addEventListener('focusout', function () { setTimeout(unzoom, 300); });
      if (window.visualViewport) visualViewport.addEventListener('resize', function () { setTimeout(unzoom, 300); });
    })();
  </script>
  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
